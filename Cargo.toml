[workspace]
members = ["core_lib", "app/main/src-tauri"]
resolver = "2"

# Single source of truth for the version. Both crates inherit it via
# `version.workspace = true`, and tauri.conf.json reads it from
# app/main/src-tauri/Cargo.toml.
#
# Only the major number is set here, by hand (`pnpm bump major`). A release
# stamps <major>.<YY>.<DDD>+<build> into its own checkout and is published as
# <major>.<YY>.<DDD>.<build>; see .github/workflows/release.yml.
[workspace.package]
version = "1.0.0"

# Profiles must live at the workspace root (per-crate profiles are ignored).
[profile.release]
# Thin LTO with the default 16 codegen units, not fat LTO with one. A release
# always compiles from scratch, and fat LTO's single-threaded final step was
# over half of it: ~4 of ~7.5 minutes per OS in CI. A cold local build went
# from 207 s to 118 s. The exe grows about 3 MB (15.5 to 18.9 MB on Windows);
# transfers are bound by the network and Bluetooth, not the CPU.
lto = "thin"
opt-level = 3
