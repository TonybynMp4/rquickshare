name: Linux build dependencies
description: >
  System packages every Rust job in this repo needs on Linux. The webkit/soup
  4.1 packages only exist from Ubuntu 24.04 onwards, so runners must be pinned
  to ubuntu-24.04 or newer.

runs:
  using: composite
  steps:
    # The .deb files are cached because the runners' Ubuntu mirror is sometimes
    # very slow: the same 64 MB took 20 s on one run and 13-18 minutes on
    # others. The key is the exact set of files apt would download, so a new
    # package version or runner image makes a new cache instead of installing
    # stale ones.
    - id: debs
      shell: bash
      env:
        PACKAGES: >-
          libdbus-1-dev
          libgtk-3-dev
          libayatana-appindicator3-dev
          librsvg2-dev
          libsoup-3.0-dev
          libjavascriptcoregtk-4.1-dev
          libwebkit2gtk-4.1-dev
      run: |
        sudo apt-get update
        # Field 2 is the file name (package_version_arch.deb); the URL in field
        # 1 names whichever mirror this runner got, so it stays out of the key.
        key=$(sudo apt-get install -y -qq --print-uris $PACKAGES | awk '{print $2}' | sort | sha256sum | cut -c1-16)
        echo "packages=$PACKAGES" >> "$GITHUB_OUTPUT"
        echo "key=$key" >> "$GITHUB_OUTPUT"
        echo "dir=$RUNNER_TEMP/apt-debs" >> "$GITHUB_OUTPUT"

    - uses: actions/cache@v6
      with:
        path: ${{ steps.debs.outputs.dir }}
        key: apt-debs-${{ runner.os }}-${{ runner.arch }}-${{ steps.debs.outputs.key }}

    - shell: bash
      env:
        PACKAGES: ${{ steps.debs.outputs.packages }}
        DEBS: ${{ steps.debs.outputs.dir }}
      run: |
        # apt reads and downloads its archives in our directory instead of
        # /var/cache/apt/archives, so a restored cache is used as it is and a
        # fresh download lands where the cache step saves from.
        mkdir -p "$DEBS/partial"
        sudo apt-get install -y -o Dir::Cache::Archives="$DEBS" $PACKAGES
        # apt's lock file is root-only; the cache is saved as the runner user.
        sudo rm -rf "$DEBS/lock" "$DEBS/partial"
